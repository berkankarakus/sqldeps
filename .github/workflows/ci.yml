name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run build and integration tests
        run: ./test.sh

      - name: Verify publish output
        run: |
          dotnet publish -c Release -nologo -o "$RUNNER_TEMP/sqldeps-publish"
          test -x "$RUNNER_TEMP/sqldeps-publish/sqldeps"
          "$RUNNER_TEMP/sqldeps-publish/sqldeps" --help >/dev/null

      - name: Verify install script
        run: |
          smoke_home="$RUNNER_TEMP/sqldeps-home"
          mkdir -p "$smoke_home"
          export HOME="$smoke_home"
          export DOTNET_CLI_HOME="$smoke_home"
          ./install.sh
          test -x "$smoke_home/.local/bin/sqldeps"
          "$smoke_home/.local/bin/sqldeps" version >/dev/null
          mkdir -p "$RUNNER_TEMP/sqldeps-smoke/sql"
          printf 'CREATE TABLE dbo.Smoke (id INT);\n' > "$RUNNER_TEMP/sqldeps-smoke/sql/smoke.sql"
          HOME="$smoke_home" "$smoke_home/.local/bin/sqldeps" index "$RUNNER_TEMP/sqldeps-smoke/sql" >/dev/null
          HOME="$smoke_home" "$smoke_home/.local/bin/sqldeps" status >/dev/null
          printf 'Content-Length: 72\r\n\r\n{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":null}}' |
            HOME="$smoke_home" "$smoke_home/.local/bin/sqldeps" lsp | grep -q '"id":1'
