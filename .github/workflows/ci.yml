name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Neovim for LSP smoke test
        shell: bash
        run: |
          nvim_version=0.12.5
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/neovim/neovim-releases/releases/download/v${nvim_version}/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -1

      - name: Restore dependencies
        run: dotnet restore

      - name: Run build and integration tests
        run: ./test.sh all

      - name: Run .NET unit tests
        run: ./test.sh unit

      - name: Run Java adapter tests
        run: ./test.sh dbeaver-java

      - name: Generate SARIF diagnostics and performance baseline
        shell: bash
        run: |
          report_db="$RUNNER_TEMP/sqldeps-ci.sqlite"
          ./bin/Release/net10.0/sqldeps index fixtures --db "$report_db" --quiet
          ./bin/Release/net10.0/sqldeps lint --db "$report_db" --sarif --no-color --no-pager > "$RUNNER_TEMP/sqldeps.sarif"
          SQLDEPS_PERF_CORPUS=fixtures ./test.sh perf > "$RUNNER_TEMP/sqldeps-perf-baseline.txt"

      - name: Upload SARIF and performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqldeps-ci-reports
          path: |
            ${{ runner.temp }}/sqldeps.sarif
            ${{ runner.temp }}/sqldeps-perf-baseline.txt

      - name: Upload SARIF to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/sqldeps.sarif

      - name: Verify publish output
        run: |
          dotnet publish -c Release -nologo -o "$RUNNER_TEMP/sqldeps-publish"
          test -x "$RUNNER_TEMP/sqldeps-publish/sqldeps"
          "$RUNNER_TEMP/sqldeps-publish/sqldeps" --help >/dev/null

      - name: Verify install script
        run: bash tests/smoke/install.sh
